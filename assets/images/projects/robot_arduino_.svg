<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <pattern id="dotgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.1" fill="#6E94A8" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Fond -->
  <rect x="0" y="0" width="1600" height="900" fill="#0E2436"/>
  <rect x="20" y="20" width="1560" height="860" fill="url(#dotgrid)"/>

  <!-- Cadre plan technique -->
  <rect x="20" y="20" width="1560" height="860" fill="none" stroke="#3E6478" stroke-width="2"/>
  <g stroke="#63D2B5" stroke-width="2">
    <path d="M20 44 L20 20 L44 20"/>
    <path d="M1556 20 L1580 20 L1580 44"/>
    <path d="M1580 856 L1580 880 L1556 880"/>
    <path d="M44 880 L20 880 L20 856"/>
  </g>

  <!-- En-tête -->
  <text x="60" y="82" font-size="19" letter-spacing="4" fill="#63D2B5">PROJET ARDUINO · C++ ORIENTÉ OBJET</text>
  <text x="58" y="146" font-size="56" font-weight="700" fill="#EAF2F5">ROBOT AUTONOME</text>
  <text x="58" y="204" font-size="56" font-weight="700" fill="#EAF2F5">À ÉVITEMENT D'OBSTACLES</text>
  <text x="60" y="238" font-size="20" font-family="Arial, sans-serif" fill="#9FBAC9">Scan par servomoteur, mesures environnementales et architecture modulaire — chaque composant, sa classe.</text>

  <!-- Bloc datasheet en haut à droite -->
  <rect x="1250" y="50" width="290" height="118" fill="#163B52" stroke="#3E6478" stroke-width="1.5"/>
  <text x="1270" y="76" font-size="13" letter-spacing="2" fill="#63D2B5">SPECS</text>
  <line x1="1270" y1="86" x2="1520" y2="86" stroke="#3E6478"/>
  <g font-size="14" fill="#9FBAC9">
    <text x="1270" y="108">MODULES</text><text x="1520" y="108" text-anchor="end" fill="#EAF2F5">04</text>
    <text x="1270" y="130">CAPTEURS</text><text x="1520" y="130" text-anchor="end" fill="#EAF2F5">03</text>
    <text x="1270" y="152">MODE</text><text x="1520" y="152" text-anchor="end" fill="#EAF2F5">AUTONOME</text>
  </g>

  <!-- Séparateur -->
  <line x1="60" y1="258" x2="1540" y2="258" stroke="#3E6478" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- ===== Illustration schématique du robot (vue du dessus) ===== -->

  <!-- Callout HC-SR04 (haut, centré) -->
  <text x="800" y="290" font-size="16" fill="#E8A33D" text-anchor="middle">HC-SR04 — distance() + régression linéaire</text>
  <path d="M800 300 L800 412" fill="none" stroke="#E8A33D" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- Arc de balayage du servo -->
  <path d="M660 430 A 140 140 0 0 1 940 430" fill="none" stroke="#E8A33D" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="655" y="425" font-size="14" fill="#E8A33D" text-anchor="end">0°</text>
  <text x="800" y="282" font-size="14" fill="#E8A33D" text-anchor="middle" opacity="0"> </text>
  <text x="800" y="300" font-size="14" fill="#E8A33D" text-anchor="middle">90°</text>
  <text x="945" y="425" font-size="14" fill="#E8A33D">180°</text>

  <!-- Chassis -->
  <rect x="640" y="420" width="320" height="200" rx="28" fill="#163B52" stroke="#EAF2F5" stroke-width="3"/>

  <!-- Roues -->
  <rect x="608" y="452" width="32" height="130" rx="10" fill="#3E6478" stroke="#EAF2F5" stroke-width="2"/>
  <rect x="960" y="452" width="32" height="130" rx="10" fill="#3E6478" stroke="#EAF2F5" stroke-width="2"/>

  <!-- Ecran LCD -->
  <rect x="690" y="442" width="220" height="60" rx="6" fill="#0E2436" stroke="#63D2B5" stroke-width="2"/>
  <line x1="705" y1="463" x2="895" y2="463" stroke="#63D2B5" stroke-width="2" opacity="0.6"/>
  <line x1="705" y1="480" x2="855" y2="480" stroke="#63D2B5" stroke-width="2" opacity="0.6"/>

  <!-- Capteur ultrason + servo (mount avant) -->
  <circle cx="800" cy="420" r="20" fill="#C4783F" stroke="#EAF2F5" stroke-width="2"/>

  <!-- DHT11 -->
  <rect x="768" y="558" width="64" height="32" rx="5" fill="#0E2436" stroke="#C4783F" stroke-width="2"/>

  <!-- Callout LCD (gauche haut) -->
  <path d="M690 468 L420 400 L280 400" fill="none" stroke="#63D2B5" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="270" y="380" font-size="16" fill="#EAF2F5" text-anchor="end">ÉCRAN LCD I2C</text>
  <text x="270" y="402" font-size="13" fill="#63D2B5" text-anchor="end">display_temperature() / display_humidity()</text>

  <!-- Callout DHT11 (gauche bas) -->
  <path d="M768 574 L420 660 L280 660" fill="none" stroke="#C4783F" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="270" y="640" font-size="16" fill="#EAF2F5" text-anchor="end">CAPTEUR DHT11</text>
  <text x="270" y="662" font-size="13" fill="#C4783F" text-anchor="end">tempe() / humi()</text>

  <!-- Callout Servo (droite haut) -->
  <path d="M900 440 L1180 400 L1320 400" fill="none" stroke="#E8A33D" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="1330" y="380" font-size="16" fill="#EAF2F5">SCAN SERVOMOTEUR</text>
  <text x="1330" y="402" font-size="13" fill="#E8A33D">0° → 180°, choix du côté dégagé</text>

  <!-- Callout L298N (droite bas) -->
  <path d="M976 520 L1180 660 L1320 660" fill="none" stroke="#63D2B5" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="1330" y="640" font-size="16" fill="#EAF2F5">DRIVER MOTEUR L298N</text>
  <text x="1330" y="662" font-size="13" fill="#63D2B5">move_forwards() · move_left() · stop()</text>

  <!-- Pieds ronds sur les callouts -->
  <g fill="#0E2436" stroke-width="2">
    <circle cx="280" cy="400" r="4" stroke="#63D2B5"/>
    <circle cx="280" cy="660" r="4" stroke="#C4783F"/>
    <circle cx="1320" cy="400" r="4" stroke="#E8A33D"/>
    <circle cx="1320" cy="660" r="4" stroke="#63D2B5"/>
  </g>

  <!-- Séparateur bas -->
  <line x1="60" y1="762" x2="1540" y2="762" stroke="#3E6478" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- Badges techniques -->
  <g font-size="14" fill="#9FBAC9">
    <g>
      <rect x="60" y="792" width="112" height="34" rx="17" fill="none" stroke="#63D2B5"/>
      <text x="116" y="814" text-anchor="middle" fill="#EAF2F5">ARDUINO</text>
    </g>
    <g>
      <rect x="184" y="792" width="80" height="34" rx="17" fill="none" stroke="#63D2B5"/>
      <text x="224" y="814" text-anchor="middle" fill="#EAF2F5">C++</text>
    </g>
    <g>
      <rect x="276" y="792" width="80" height="34" rx="17" fill="none" stroke="#63D2B5"/>
      <text x="316" y="814" text-anchor="middle" fill="#EAF2F5">OOP</text>
    </g>
    <g>
      <rect x="368" y="792" width="80" height="34" rx="17" fill="none" stroke="#63D2B5"/>
      <text x="408" y="814" text-anchor="middle" fill="#EAF2F5">I2C</text>
    </g>
    <g>
      <rect x="460" y="792" width="80" height="34" rx="17" fill="none" stroke="#63D2B5"/>
      <text x="500" y="814" text-anchor="middle" fill="#EAF2F5">PWM</text>
    </g>
    <g>
      <rect x="552" y="792" width="96" height="34" rx="17" fill="none" stroke="#63D2B5"/>
      <text x="600" y="814" text-anchor="middle" fill="#EAF2F5">SERVO</text>
    </g>
    <g>
      <rect x="664" y="792" width="214" height="34" rx="17" fill="none" stroke="#63D2B5"/>
      <text x="771" y="814" text-anchor="middle" fill="#EAF2F5">RÉGRESSION LINÉAIRE</text>
    </g>
  </g>

  <!-- Cartouche (title block) -->
  <rect x="1280" y="774" width="260" height="86" fill="#163B52" stroke="#3E6478" stroke-width="1.5"/>
  <text x="1296" y="796" font-size="12" fill="#9FBAC9">PROJET: ROBOT AUTONOME</text>
  <text x="1296" y="814" font-size="12" fill="#9FBAC9">REV: 1.0 · ARDUINO / C++</text>
  <text x="1296" y="832" font-size="12" fill="#EAF2F5">AUTEUR: YAN AKOUEDENOUDJE</text>
  <text x="1296" y="850" font-size="12" fill="#63D2B5">GITHUB.COM/YANAKOUEDENOUDJE</text>
</svg>
