name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [ "main" ] # Déploie automatiquement lors d'un push sur main
  workflow_dispatch:     # Permet de lancer le déploiement manuellement

# Accorde les permissions nécessaires pour déployer sur Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Annule les exécutions précédentes si une nouvelle version est poussée
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v4

      - name: Téléverser l'artefact (fichiers HTML/CSS)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Déploie tout le dossier racine

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
